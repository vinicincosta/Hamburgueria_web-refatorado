{% extends 'inicio.html' %}
{% block content %}
<!-- Formulário de edição de bebida — campos e action preservados -->
<div class="form-page">
  <div class="form-card">
    <div class="form-title">Editar Bebida</div>
    <p class="message" style="margin-bottom:24px">Altere os dados da bebida</p>

    <form method="post"
          action="{{ url_for('editar_bebida', id_bebida=bebida['id_bebida']) }}">

      <div class="field-group">
        <label>Nome da Bebida</label>
        <input name="nome_bebida" type="text"
               value="{{ bebida['nome_bebida'] }}" required>
      </div>

      <div class="field-row">
        <div class="field-group">
          <label>Valor (R$)</label>
          <input name="valor" type="number" step="0.01"
                 value="{{ bebida['valor'] }}" required>
        </div>
        <div class="field-group">
          <label>Quantidade</label>
          <input name="quantidade" type="number" step="0.01"
                 value="{{ bebida['quantidade'] }}" required>
        </div>
      </div>

      <div class="field-row">
        <div class="field-group">
          <label>Disponibilidade</label>
          <select name="status_bebida">
            <option value="true"
              {% if bebida['status_bebida'] %}selected{% endif %}>Disponível</option>
            <option value="false"
              {% if not bebida['status_bebida'] %}selected{% endif %}>Indisponível</option>
          </select>
        </div>
        <div class="field-group">
          <label>Categoria</label>
          <select name="categoria" required>
            <option value="">Selecione</option>
            {% for c in categorias %}
            <option value="{{ c['id_categoria'] }}"
              {% if c['id_categoria'] == bebida['categoria'] %}selected{% endif %}>
              {{ c['nome_categoria'] }}
            </option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="field-group">
        <label>Descrição</label>
        <input name="descricao" type="text"
               value="{{ bebida['descricao'] }}" required>
      </div>

      <button type="submit" class="btn-salvar">Salvar Alterações</button>
      <a href="{{ url_for('bebidas') }}" class="btn-cancelar">← Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
