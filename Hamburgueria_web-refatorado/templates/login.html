{% extends 'inicio.html' %}
{% block content %}

<!--
  login.html
  Formulário de login centralizado.
  Action e campos preservados.
-->

<div class="login-page" style="margin-top:var(--header-h)">
  <div class="form-card">

    <!-- Logo + título -->
    <div style="text-align:center; margin-bottom:28px">
      <img src="{{ url_for('static', filename='imgdois.png') }}" alt="Royal Burger"
           style="width:56px; height:56px; object-fit:contain; margin-bottom:10px">
      <div style="font-size:20px; font-weight:800; color:var(--accent)">Royal Burger</div>
      <div style="font-size:13px; color:var(--muted); margin-top:4px">Sistema de Gestão</div>
    </div>

    <!-- Formulário de login -->
    <form action="{{ url_for('login') }}" method="POST">

      <div class="field-group">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="text" placeholder="seu@email.com" required>
      </div>

      <div class="field-group">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-salvar" style="margin-top:16px">
        Entrar
      </button>

    </form>

  </div>
</div>

{% endblock %}
