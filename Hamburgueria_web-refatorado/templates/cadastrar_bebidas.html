{% extends 'inicio.html' %}
{% block content %}
<!-- Formulário de cadastro de bebida — campos e action preservados -->
<div class="form-page">
  <div class="form-card">
    <div class="form-title">Cadastrar Bebida</div>
    <p class="message" style="margin-bottom:24px">Adicione uma nova bebida ao estoque</p>
    <form method="post" action="{{ url_for('cadastrar_bebidas') }}">
      <div class="field-group">
        <label>Nome</label>
        <input name="nome_bebida" type="text" placeholder="Ex: Coca-Cola 350ml" required>
      </div>
      <div class="field-row">
        <div class="field-group">
          <label>Valor (R$)</label>
          <input name="valor" type="number" step="0.01" placeholder="0.00" required>
        </div>
        <div class="field-group">
          <label>Categoria</label>
          <select name="categoria" required>
            <option value="" disabled selected>Selecione</option>
            {% for c in categorias %}
            <option value="{{ c['id_categoria'] }}">{{ c['nome_categoria'] }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="field-group">
        <label>Descrição</label>
        <textarea name="descricao" rows="2" placeholder="Descreva a bebida..."></textarea>
      </div>
      <button type="submit" class="btn-salvar">Cadastrar</button>
      <a href="{{ url_for('bebidas') }}" class="btn-cancelar">← Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
