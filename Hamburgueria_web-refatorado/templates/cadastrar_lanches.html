{% extends 'inicio.html' %}
{% block content %}
<!-- Formulário de cadastro de lanche — campos e action preservados -->
<div class="form-page">
  <div class="form-card">
    <div class="form-title">Cadastrar Lanche</div>
    <p class="message" style="margin-bottom:24px">Adicione um novo item ao cardápio</p>
    <form method="post" action="{{ url_for('cadastrar_lanches') }}">
      <div class="field-group">
        <label>Nome</label>
        <input name="nome_lanche" type="text" placeholder="Ex: X-Burguer Royal" required>
      </div>
      <div class="field-group">
        <label>Descrição</label>
        <input name="descricao_lanche" type="text" placeholder="Ingredientes principais...">
      </div>
      <div class="field-group">
        <label>Valor (R$)</label>
        <input name="valor_lanche" type="number" step="0.01" placeholder="0.00" required>
      </div>
      <button type="submit" class="btn-salvar">Cadastrar</button>
      <a href="{{ url_for('lanches') }}" class="btn-cancelar">← Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
