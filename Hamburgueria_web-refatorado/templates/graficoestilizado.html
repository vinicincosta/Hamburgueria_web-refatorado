{% extends 'inicio.html' %}
{% block content %}
<!-- Gráfico estilizado com avatar — lógica JS preservada -->
<main class="contanier-geral">
  <div class="page-header">
    <h2>🏆 Ranking <span>Garçons — Mensal</span></h2>
    <div class="page-actions">
      <input type="month" id="mes"
             style="background:var(--bg-input);border:1px solid var(--border);
                    border-radius:var(--r-md);color:var(--text);padding:8px 12px;
                    font-size:13px;outline:none">
      <button onclick="carregarGraficoMes()" class="btn-cadastrar">Atualizar</button>
    </div>
  </div>
  <div class="card-grafico" style="max-width:100%">
    <div id="total-mes" style="font-size:18px;font-weight:700;color:var(--green);
                                margin-bottom:16px"></div>
    <canvas id="graficoVendasMes" height="150"></canvas>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
/* Lógica original preservada — plugin de avatar estilizado */
let graficoMes = null;
const avatarImg = new Image();
avatarImg.src = '/static/img/user.png';
const pluginAvatar = {
  id:'avatarPlugin',
  afterDatasetsDraw(chart) {
    const ctx = chart.ctx;
    chart.getDatasetMeta(0).data.forEach((bar, i) => {
      const x=bar.x, y=bar.y-40, r=18;
      ctx.save(); ctx.beginPath(); ctx.arc(x,y-15,r,0,Math.PI*2);
      ctx.closePath(); ctx.clip();
      ctx.drawImage(avatarImg,x-r,y-r-15,r*2,r*2); ctx.restore();
      ctx.save(); ctx.fillStyle='#fff'; ctx.font='bold 12px Arial';
      ctx.textAlign='center'; ctx.fillText(chart.data.labels[i],x,y-45); ctx.restore();
    });
  }
};
Chart.register(pluginAvatar);
async function carregarGraficoMes() {
  const mes = document.getElementById('mes').value;
  let url = '/vendas_valor_por_funcionario_mes';
  if (mes) url += `?month=${mes}`;
  const res = await fetch(url);
  const dados = await res.json();
  const totals = dados.totals??[];
  document.getElementById('total-mes').innerHTML =
    `💰 Total do mês: <strong>R$ ${totals.reduce((a,b)=>a+b,0).toFixed(2)}</strong>`;
  const ctx = document.getElementById('graficoVendasMes').getContext('2d');
  const grad = ctx.createLinearGradient(0,0,0,300);
  grad.addColorStop(0,'rgba(75,192,75,1)'); grad.addColorStop(1,'rgba(75,192,75,0.3)');
  if (graficoMes) graficoMes.destroy();
  graficoMes = new Chart(ctx, {
    type:'bar',
    data:{ labels:dados.labels, datasets:[{
      label:'Total vendido (R$)', data:totals, backgroundColor:grad, borderRadius:14
    }]},
    options:{
      responsive:true,
      plugins:{ legend:{labels:{color:'#fff'}},
        tooltip:{ callbacks:{ label: c=>`R$ ${c.raw.toFixed(2)}` } } },
      scales:{
        x:{ ticks:{color:'#8a9bb0'}, grid:{display:false} },
        y:{ ticks:{color:'#8a9bb0'}, beginAtZero:true,
            grid:{color:'rgba(255,255,255,0.06)'} }
      }
    }
  });
}
window.onload = () => {
  const d = new Date();
  document.getElementById('mes').value =
    `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  carregarGraficoMes();
};
</script>
{% endblock %}
