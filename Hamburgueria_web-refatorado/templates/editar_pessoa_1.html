{% extends 'inicio.html' %}
{% block content %}
<!-- editar_pessoa_1.html — edição de pessoa por admin (campos e action preservados) -->
<div class="form-page">
  <div class="form-card">
    <div class="form-title">Editar Funcionário</div>
    <p class="message" style="margin-bottom:24px">Altere os dados do funcionário</p>

    <form method="post"
          action="{{ url_for('editar_pessoa', id_pessoa=pessoa['id_pessoa']) }}">

      <div class="field-group">
        <label>Nome</label>
        <input name="nome_pessoa" type="text"
               value="{{ pessoa['nome_pessoa'] }}" required>
      </div>

      <div class="field-row">
        <div class="field-group">
          <label>Cargo</label>
          <select name="cargo">
            <option value="garcom"
              {% if pessoa['papel']=='garcom' %}selected{% endif %}>Garçom</option>
            <option value="cozinha"
              {% if pessoa['papel']=='cozinha' %}selected{% endif %}>Cozinha</option>
            <option value="admin"
              {% if pessoa['papel']=='admin' %}selected{% endif %}>Administrador</option>
          </select>
        </div>
        <div class="field-group">
          <label>Salário (R$)</label>
          <input name="salario" type="number" step="0.01"
                 value="{{ pessoa['salario'] }}" required>
        </div>
      </div>

      <div class="field-group">
        <label>E-mail</label>
        <input name="email" type="email" value="{{ pessoa['email'] }}" required>
      </div>

      <div class="field-group">
        <label>Status</label>
        <div style="display:flex;gap:20px;margin-top:4px">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;
                        color:var(--text);font-size:14px">
            <input type="radio" name="status" value="Ativo"
                   {% if pessoa['status']=='Ativo' %}checked{% endif %}
                   style="accent-color:var(--accent)"> Ativo
          </label>
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;
                        color:var(--text);font-size:14px">
            <input type="radio" name="status" value="Inativo"
                   {% if pessoa['status']=='Inativo' %}checked{% endif %}
                   style="accent-color:var(--accent)"> Inativo
          </label>
        </div>
      </div>

      <button type="submit" class="btn-salvar">Salvar Alterações</button>
      <a href="{{ url_for('pessoas') }}" class="btn-cancelar">← Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
