{% extends 'inicio.html' %}
{% block content %}
<!-- Formulário de vínculo lanche × insumo — campos e action preservados -->
<div class="form-page">
  <div class="form-card">
    <div class="form-title">Cadastrar Receita</div>
    <p class="message" style="margin-bottom:24px">Vincule um insumo a um lanche</p>

    <form method="POST" action="{{ url_for('cadastrar_lanche_insumos') }}">

      <div class="field-group">
        <label>Lanche</label>
        <select name="lanche_id" required>
          <option value="" disabled selected>Selecione o lanche</option>
          {% for lanche in lanches %}
          <option value="{{ lanche.id_lanche }}">{{ lanche.nome_lanche }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="field-group">
        <label>Insumo</label>
        <select name="insumo_id" required>
          <option value="" disabled selected>Selecione o insumo</option>
          {% for insumo in insumos %}
          <option value="{{ insumo.id_insumo }}">{{ insumo.nome_insumo }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="field-group">
        <label>Quantidade (g)</label>
        <input type="number" name="qtd_insumo" min="1" placeholder="Ex: 150" required>
      </div>

      <button type="submit" class="btn-salvar">Salvar Receita</button>
      <a href="{{ url_for('lanche_insumos') }}" class="btn-cancelar">← Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
