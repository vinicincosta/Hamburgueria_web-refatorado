{% extends 'inicio.html' %}
{% block content %}
<!--
  cadastrar_entradas.html
  Formulário de registro de entrada de estoque.
  Lógica de radio insumo/bebida e apareceInsumo/apareceBebida preservadas.
-->

<style>
    /* Corrige visual dos SELECTs e OPTIONs */
    select {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #444;
        background-color: #1f1f1f;
        color: #fff;
        font-size: 14px;
        outline: none;
    }

    /* Corrige cor dos itens do dropdown */
    select option {
        background-color: #1f1f1f;
        color: #ffffff;
    }

    /* Placeholder desabilitado */
    select option:disabled {
        color: #999;
    }
</style>

<div class="form-page">
    <div class="form-card">
        <div class="form-title">Registrar Entrada</div>
        <p class="message" style="margin-bottom:24px">
            Entrada de insumo ou bebida no estoque
        </p>

        <form method="post" action="{{ url_for('cadastrar_entradas') }}">

            <!-- Seleção do tipo de item — controla campos via JS -->
            <div class="field-group">
                <label>Tipo de Item</label>

                <div style="display:flex; gap:16px; margin-top:4px">
                    <label style="
                        display:flex;
                        align-items:center;
                        gap:8px;
                        cursor:pointer;
                        color:var(--text);
                        font-size:14px">

                        <input type="radio"
                               name="tipo"
                               value="insumo"
                               checked
                               onclick="apareceInsumo()"
                               style="accent-color:var(--accent)">

                        Insumo
                    </label>

                    <label style="
                        display:flex;
                        align-items:center;
                        gap:8px;
                        cursor:pointer;
                        color:var(--text);
                        font-size:14px">

                        <input type="radio"
                               name="tipo"
                               value="bebida"
                               onclick="apareceBebida()"
                               style="accent-color:var(--accent)">

                        Bebida
                    </label>
                </div>
            </div>

            <!-- Campo de insumo -->
            <div id="insumoLabel" class="field-group">
                <label>Insumo</label>

                <select name="insumo_id" id="insumo_id">
                    <option value="">
                        Selecione um insumo
                    </option>

                    {% for i in insumos %}
                    <option value="{{ i['id_insumo'] }}">
                        {{ i['nome_insumo'] }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Campo de bebida -->
            <div id="bebidaLabel"
                 class="field-group">

                <label>Bebida</label>

                <select name="bebida_id" id="bebida_id">
                    <option value="" >
                        Selecione uma bebida
                    </option>

                    {% for b in bebidas %}
                    <option value="{{ b['id_bebida'] }}">
                        {{ b['nome_bebida'] }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="field-row">
                <div class="field-group">
                    <label>Quantidade</label>

                    <input name="qtd_entradas"
                           type="number"
                           min="1"
                           placeholder="0"
                           required>
                </div>

                <div class="field-group">
                    <label>Valor (R$)</label>

                    <input name="valor_entrada"
                           type="number"
                           step="0.01"
                           placeholder="0.00"
                           required>
                </div>
            </div>

            <div class="field-group">
                <label>Nota Fiscal</label>

                <input name="nota_fiscal"
                       type="text"
                       placeholder="Número da NF"
                       required>
            </div>

            <button type="submit" class="btn-salvar">
                Registrar Entrada
            </button>

            <a href="{{ url_for('entradas') }}"
               class="btn-cancelar">
                ← Cancelar
            </a>
        </form>
    </div>
</div>

<script>
    /* Controla visibilidade dos campos insumo/bebida */
    function apareceInsumo() {
    document.getElementById('insumoLabel').style.display = 'block';
    document.getElementById('bebidaLabel').style.display = 'none';

    document.querySelector("select[name='insumo_id']").disabled = false;
    document.querySelector("select[name='bebida_id']").disabled = true;
}

function apareceBebida() {
    document.getElementById('insumoLabel').style.display = 'none';
    document.getElementById('bebidaLabel').style.display = 'block';

    document.querySelector("select[name='insumo_id']").disabled = true;
    document.querySelector("select[name='bebida_id']").disabled = false;
}
</script>

{% endblock %}
